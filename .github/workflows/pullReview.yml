name: PR Review Time Monitor

on:
  schedule:
    - cron: '30 * * * *'  # Cada hora en el minuto 30
  workflow_dispatch:

jobs:
  check-pull-requests:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Verify 2-reviewer policy
        run: |
          echo "VERIFICACIÓN OKR 3.6: PR review aprobado por 2 developers"
          echo ""
          echo "POLÍTICA IMPLEMENTADA:"
          echo "1. Mínimo 2 aprobaciones requeridas por PR"
          echo "2. Validación mediante branch protection rules"
          echo "3. Monitorización automática cada hora"
          echo ""
          echo "OBJETIVO: Reducir errores mediante doble validación"
          echo "MÉTRICA: 100% de PRs requieren 2 aprobaciones"
          echo "INTEGRACIÓN: Con sistemas de calidad (OKR 3)"
          echo ""
          echo "ESTE WORKFLOW ASEGURA:"
          echo "- Notificación de PRs cerca del límite (24h)"
          echo "- Visibilidad del tiempo de review"
          echo "- Cumplimiento de política de 2 reviewers"
          
      - name: Analyze open pull requests
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            // OKR 3.6: Política de 2 reviewers
            const REQUIRED_REVIEWERS = 2;
            const MAX_REVIEW_HOURS = 24;  // OKR 2.4: h = 24 horas
            
            console.log(`OKR 3.6: Validando política de ${REQUIRED_REVIEWERS} reviewers`);
            console.log(`OKR 2.4: Tiempo máximo review: ${MAX_REVIEW_HOURS} horas`);
            
            const pullRequests = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            
            const currentTime = new Date();
            
            for (const pr of pullRequests.data) {
              const creationTime = new Date(pr.created_at);
              const hoursOpen = (currentTime - creationTime) / 1000 / 3600;
              
              // OKR 2.4: Notificar si se acerca al límite
              if (hoursOpen >= MAX_REVIEW_HOURS - 2) { 
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `**OKR 2.4 + 3.6**\n\nEste PR lleva ${hoursOpen.toFixed(1)}h abierto (límite: ${MAX_REVIEW_HOURS}h).\n\n✅ **Política OKR 3.6:** Requiere ${REQUIRED_REVIEWERS} aprobaciones antes de merge.`
                });
              }
              
              // OKR 3.6: Verificar reviews actuales
              const reviews = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              
              const approvedReviews = reviews.data.filter(r => r.state === 'APPROVED').length;
              console.log(`PR #${pr.number}: ${approvedReviews}/${REQUIRED_REVIEWERS} aprobaciones`);
              
              if (approvedReviews < REQUIRED_REVIEWERS && hoursOpen > 12) {
                console.log(`PR #${pr.number} necesita más reviews (${REQUIRED_REVIEWERS} requeridos)`);
              }
            }
            
            console.log('OKR 3.6: Sistema de validación de 2 reviewers implementado');
            console.log('OKR 2.4: Sistema de monitorización de tiempo implementado');
